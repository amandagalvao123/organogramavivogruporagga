<title>Organograma Vivo Ragga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app com barra lateral arredondada (desktop) / trilho de navegação no topo (celular); roxo Ragga comunica, cada vertical na sua cor */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --surface2:#EFEBF6; --fg:#1E1733; --muted:#6B6380; --line:#DDD6EA;
  --roxo:#2D204E; --roxo-soft:#E7E1F3; --on-roxo:#FFFFFF;
  --sal:#B81A20; --louro:#2B4899; --alho:#B8890A; --pimenta:#E86820; --manj:#8A2040; --oreg:#6E8F14; --alec:#35632A;
  /* cores de marca fixas (fundos com logo branco, iguais nos dois temas) */
  --b-roxo:#2D204E; --b-sal:#B81A20; --b-louro:#2B4899; --b-alho:#D4A010; --b-pimenta:#E86820; --b-manj:#8A2040; --b-oreg:#93B629; --b-alec:#35632A;
  --ok:#1F8A4C; --warn:#C27C0E; --crit:#B42318; --info:#3B5BDB;
  --f-display:"Outfit", "DM Sans", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:16px; --r-s:10px;
  --shadow:0 1px 2px rgba(45,32,78,.06),0 6px 20px rgba(45,32,78,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F1F; --surface:#1C1730; --surface2:#251F3D; --fg:#EEEAF7; --muted:#A79FBF; --line:#342C50;
  --roxo:#B9A6F0; --roxo-soft:#2E2650; --on-roxo:#130F1F;
  --sal:#F0646A; --louro:#7C9BFF; --alho:#E8B83A; --pimenta:#FF9450; --manj:#E0779E; --oreg:#B5D448; --alec:#7FC06A;
  --ok:#4CC27E; --warn:#F0B44C; --crit:#FF7A6E; --info:#8EA6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F1F; --surface:#1C1730; --surface2:#251F3D; --fg:#EEEAF7; --muted:#A79FBF; --line:#342C50;
  --roxo:#B9A6F0; --roxo-soft:#2E2650; --on-roxo:#130F1F;
  --sal:#F0646A; --louro:#7C9BFF; --alho:#E8B83A; --pimenta:#FF9450; --manj:#E0779E; --oreg:#B5D448; --alec:#7FC06A;
  --ok:#4CC27E; --warn:#F0B44C; --crit:#FF7A6E; --info:#8EA6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.lg-w{display:none}
:root[data-theme="dark"] .lg-c{display:none} :root[data-theme="dark"] .lg-w{display:inline-block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-c{display:none} :root:not([data-theme="light"]) .lg-w{display:inline-block}}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:400;letter-spacing:-.02em} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--roxo);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--roxo);font-weight:500}
.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.brand-mark{width:44px;height:44px;flex:none;display:grid;place-items:center}
.brand-mark img{width:44px;height:44px}
.brand b{font-family:var(--f-display);font-weight:500;font-size:1.05rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--b-roxo);color:#fff}
.nav a svg{color:var(--ic)}
.nav a.on svg{color:#fff}
.nav a .ct{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;opacity:.75}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:0 8px}
main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.head p{max-width:62ch;color:var(--muted);margin-top:6px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;margin:0 -4px;padding:0 4px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:7px 12px;background:var(--surface2);font-size:.86rem}
  .nav a .ct{display:none}
  .side-foot{display:none}
  main{padding-block:18px 60px}
}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.bign{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .kpis.bign{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis,.kpis.bign{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--vc,var(--roxo));background:color-mix(in srgb,var(--vc,var(--roxo)) 6%,var(--surface))}
.kpi .n{color:var(--vc,var(--fg))}
.kpi .n{font-family:var(--f-display);font-size:2.5rem;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-weight:600;font-size:.9rem}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--b-roxo);color:#fff;border-color:transparent}
.kpi.hero .n{color:#fff}
.kpi.hero .s{color:inherit;opacity:.8}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.st-ok{color:var(--ok)} .st-novo{color:var(--info)} .st-inicia{color:var(--warn)} .st-confirmar{color:var(--crit)} .st-fora{color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:.88rem}
.bar .t{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar .t span{display:block;height:100%;border-radius:999px}
@media (max-width:480px){.bar{grid-template-columns:110px minmax(0,1fr) 32px}}

/* mapa da cadeia (painel) */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .node{padding:10px 14px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:.85rem;display:flex;flex-direction:column}
.flow .node small{font-weight:400;color:var(--muted);font-size:.74rem}
.flow .arr{color:var(--muted);font-size:1.1rem}

/* organograma */
.org-scroll{overflow-x:auto;padding-bottom:8px;margin:0 -4px;-webkit-overflow-scrolling:touch}
.org{min-width:1420px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.top{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:end;width:100%;max-width:760px;position:relative;padding-top:14px}
.top::before{content:"";position:absolute;top:0;left:25%;width:25%;height:14px;border:2px solid var(--line);border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.top::after{content:"";position:absolute;top:0;bottom:-1px;left:50%;margin-left:-1.5px;border-left:3px solid var(--roxo);z-index:1}
.lat.r{position:relative}
.lat.r::before{content:"";position:absolute;top:-14px;left:-14px;width:calc(50% + 14px);height:14px;border:2px dashed var(--line);border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vline.dir{width:3px;background:var(--roxo)}
.lat.r .pcard.dash{border-style:dashed}
.fin{font-size:.75rem;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.topscroll{overflow-x:auto;overflow-y:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;height:16px;background:var(--bg);margin:0 -4px}
.topscroll div{height:1px}
@media (max-width:900px){.topscroll{top:calc(env(safe-area-inset-top,0px) + 96px)}}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--vc,var(--roxo));border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);width:100%;position:relative;transition:transform .12s ease,border-color .12s}
.pcard:hover{transform:translateY(-1px);border-color:var(--vc,var(--roxo))}
.pcard.hl{outline:3px solid var(--warn);outline-offset:2px}
.orgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orgbar select{min-width:220px}
.btn{border:0;background:var(--b-roxo);color:#fff;padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.15)}
.wkpanel{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.wkpanel .row{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.print-head{display:none}
@media print{
  @page{size:A3 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .side,.noprint,.head .legend,.head p{display:none!important}
  .app{display:block}
  main{padding:0}
  .print-head{display:flex!important;justify-content:space-between;align-items:center;margin-bottom:6px}
  .org-scroll{overflow:visible}
  .org{min-width:0;width:100%;zoom:.98}
  .pcard{box-shadow:none}
  .wkpanel{break-inside:avoid}
}
.pcard .nm{font-weight:600;font-size:.9rem;line-height:1.25}
.pcard .cg{font-size:.76rem;color:var(--muted);line-height:1.3}
.pcard .bd{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
.pcard.dash{border-style:dashed;box-shadow:none;background:transparent}
.pcard.big{border:0;background:var(--b-roxo);color:#fff;padding:14px 18px;text-align:center;align-items:center}
.pcard.big .nm{font-family:var(--f-display);font-weight:500;font-size:1.2rem}
.pcard.big .cg{color:#fff;opacity:.8}
.pcard.big img{height:34px;width:auto;margin-bottom:6px}
.lat{display:flex;flex-direction:column;gap:6px;position:relative}
.lat .lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vline{width:2px;height:22px;background:var(--line)}
.staff{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:1240px;padding:14px;border-radius:var(--r);background:var(--roxo-soft);position:relative}
.vlogos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vlogo{border-radius:var(--r);padding:16px;background:var(--vb);color:#fff;display:flex;flex-direction:column;gap:12px;text-decoration:none;min-height:110px;justify-content:space-between;transition:transform .15s}
.vlogo:hover{transform:translateY(-2px)}
.vlogo.total{grid-column:1/-1;background:linear-gradient(110deg,var(--b-roxo) 0%,var(--b-roxo) 55%,var(--b-sal) 70%,var(--b-pimenta) 78%,var(--b-alho) 86%,var(--b-oreg) 93%,var(--b-louro) 100%);min-height:auto}
.vlogo.total:hover{transform:none}
.vlogo .tl{font-family:var(--f-display);font-weight:400;font-size:1.1rem;letter-spacing:.02em}
.vlogo.total .r b{font-size:2.6rem}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wk-h{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.wk-h summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;list-style:none}
.wk-h summary::-webkit-details-marker{display:none}
.wk-h .list{margin-top:6px}
.vlogo img{height:24px;width:auto;max-width:100%;object-fit:contain;object-position:left}
.vlogo .r{display:flex;justify-content:space-between;align-items:flex-end;font-size:.78rem;opacity:.9}
.vlogo .r b{font-family:var(--f-display);font-weight:300;font-size:2rem;line-height:1}
.hlogo{height:28px;width:auto;max-width:100%}
.staff>.eyebrow{grid-column:1/-1;color:var(--roxo)}
.hline{height:2px;background:var(--line);width:calc(100% - 140px)}
.cols{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:12px;width:100%;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;position:relative;padding-top:16px}
.col::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:2px solid var(--line)}
.vh{border-radius:14px;padding:12px;color:#fff;background:var(--vb);display:flex;flex-direction:column;gap:8px;min-height:88px;justify-content:space-between}
.vh img{height:22px;width:auto;max-width:100%;object-fit:contain;object-position:left}
.vh b{display:block;font-family:var(--f-display);font-weight:400;font-size:.95rem;line-height:1.15}
.vh small{opacity:.85;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grp{border:1px solid color-mix(in srgb,var(--vc) 28%,var(--line));border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--vc) 9%,var(--surface))}
.grp .sl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:6px 4px 0}
.grp>.gt{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--vc);padding:2px 4px}
.grp .sub{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--vc)}
.vaga{font-size:.74rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.vaga .mono{color:var(--warn);font-weight:600}
.proj{font-size:.8rem;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .sw{width:20px;height:0;border-top:2px solid var(--muted)} .legend .sw.d{border-top-style:dashed}

/* alvo */
.clevel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seat{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--vc)}
.seat .sg{font-family:var(--f-display);font-weight:500;font-size:1.6rem;color:var(--vc)}
.seat{background:color-mix(in srgb,var(--vc) 6%,var(--surface))}
.banner{border-radius:var(--r);padding:14px 16px;background:var(--roxo-soft);color:var(--fg);font-size:.92rem}

/* pessoas */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;color:var(--fg);min-width:0}
input.in{flex:1 1 220px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;font-weight:500}
.seg button.on{background:var(--roxo);color:var(--on-roxo);border-color:transparent}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pp{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.pp{border-left:4px solid var(--vc)}
.pp:hover{border-color:var(--vc)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:500;font-size:.85rem;color:#fff;background:var(--vb,var(--vc));flex:none}
.pp .tx{min-width:0;display:flex;flex-direction:column}
.pp .tx b{font-size:.92rem;line-height:1.25}
.pp .tx span{font-size:.78rem;color:var(--muted);line-height:1.3}
.pp .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

/* agenda */
.wk-scroll{overflow-x:auto}
.wk{display:grid;grid-template-columns:52px repeat(5,minmax(150px,1fr));min-width:820px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wk .dh{padding:10px;font-weight:600;font-size:.85rem;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface2)}
.wk .dh:first-child{border-left:0}
.wk .hours{position:relative}
.wk .hours div{position:absolute;right:6px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);transform:translateY(-50%)}
.wk .day{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.ev{position:absolute;border-radius:8px;padding:4px 6px;font-size:.72rem;line-height:1.2;overflow:hidden;cursor:pointer;border:0;text-align:left;background:color-mix(in srgb,var(--vc) 16%,var(--surface));color:var(--fg);border-left:3px solid var(--vc)}
.ev b{display:block;font-weight:600}
.ev.soft{background:transparent;border:1px dashed var(--vc);border-left-width:3px;border-left-style:solid}
.ev:hover{z-index:3;box-shadow:var(--shadow)}
.dlist{display:none;flex-direction:column;gap:8px}
@media (max-width:760px){.wk-scroll{display:none}.dlist{display:flex}}
.dl-item{display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--vc);cursor:pointer;text-align:left;width:100%}
.dl-item .h{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:none;width:92px}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* lojas */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.store{padding:14px;border-radius:14px;background:color-mix(in srgb,var(--sal) 5%,var(--surface));border:1px solid var(--line);border-top:4px solid var(--b-sal);display:flex;flex-direction:column;gap:6px}
.store b{font-family:var(--f-display);font-weight:500;font-size:1.1rem}
.store .mini{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.store .mini strong{font-family:var(--f-mono);color:var(--fg)}

.store{cursor:pointer;text-align:left;font:inherit;color:inherit}
.store:hover,.store.on{border-color:var(--b-sal);box-shadow:var(--shadow)}
.store.on{background:color-mix(in srgb,var(--sal) 14%,var(--surface))}
.lrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--b-sal);cursor:pointer;font-size:.8rem;text-align:left;width:100%}
.lrow:hover{border-color:var(--b-sal)}
.lrow b{font-weight:600}
.ldet{display:flex;flex-direction:column;gap:16px;border-top:5px solid var(--b-sal)}
.ldet .x{border:0;background:var(--surface2);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.turno{display:flex;flex-direction:column;gap:10px}
.setores{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-items:start}
.setor{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--sal) 6%,var(--surface));border:1px solid var(--line)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.lp{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.lp .tx{display:flex;flex-direction:column;min-width:0}
.lp .tx b{font-size:.86rem;font-weight:600}
.lp .tx span{font-size:.75rem;color:var(--muted)}
.lp.vg{border-style:dashed;background:transparent}
.lp .chip{flex:none}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,10,30,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:21;box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 20px;gap:14px;overflow-y:auto;border-radius:20px 0 0 20px}
.drawer .x{align-self:flex-end;border:0;background:var(--surface2);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.link{color:var(--roxo);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.evrow{display:flex;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:.84rem;border-left:3px solid var(--vc);cursor:pointer;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.evrow .h{font-family:var(--f-mono);color:var(--muted);flex:none;width:118px;font-size:.78rem}
.pend{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.pend .n{font-family:var(--f-mono);color:var(--crit);font-weight:600;flex:none;width:26px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

}

function evFiltro(){return E.filter(e=>(aEnc||ativo(e))&&(aSoft||!e.soft)&&(!aPessoa||e.p.includes(aPessoa)||e.c===aPessoa));}
function fillAgenda(){
  const L=evFiltro(), H0=8, H1=20, hh=54;
  const tm=x=>{const [h,m]=x.split(":");return +h+m/60};
  let html=`<div class="dh"></div>`+[1,2,3,4,5].map(d=>`<div class="dh">${["","Segunda","Terça","Quarta","Quinta","Sexta"][d]}</div>`).join("");
  html+=`<div class="hours" style="height:${(H1-H0)*hh}px">${Array.from({length:H1-H0},(_,i)=>`<div style="top:${i*hh+ (i?0:8)}px">${String(H0+i).padStart(2,"0")}h</div>`).join("")}</div>`;
  for(let d=1;d<=5;d++){
    const de=L.filter(e=>e.d.includes(d)).sort((a,b)=>tm(a.a)-tm(b.a)||hrs(b)-hrs(a));
    // agrupa blocos que se sobrepõem e divide a largura igualmente dentro de cada grupo
    let cl=[], clEnd=-1, lanes=[];
    const flush=()=>{const n=lanes.length; cl.forEach(e=>e._n=n); cl=[]; lanes=[];};
    de.forEach(e=>{ if(tm(e.a)>=clEnd) flush(); let i=lanes.findIndex(end=>end<=tm(e.a)); if(i<0){i=lanes.length;lanes.push(0)} lanes[i]=tm(e.b); e._l=i; cl.push(e); clEnd=Math.max(clEnd,tm(e.b)); });
    flush();
    html+=`<div class="day" style="height:${(H1-H0)*hh}px;--hh:${hh}px">${de.map(e=>{const top=(tm(e.a)-H0)*hh, h=Math.max(hrs(e)*hh-3,20), w=100/e._n;
      return `<button class="ev ${e.soft?"soft":""}" data-e="${e.id}" style="--vc:${vc(e.v)};top:${top+1}px;height:${h}px;left:calc(${e._l*w}% + 3px);width:calc(${w}% - 6px);${ativo(e)?"":"opacity:.5"}" title="${esc(e.t)} · ${e.a}–${e.b}"><b>${esc(e.t)}</b>${h>34?`<span class="mono">${e.a}–${e.b}</span>`:""}</button>`;}).join("")}</div>`;
  }
  $("#wk").innerHTML=html;
  const dd=L.filter(e=>e.d.includes(aDia)).sort((a,b)=>tm(a.a)-tm(b.a));
  $("#dl").innerHTML= dd.length? dd.map(e=>`<button class="dl-item" data-e="${e.id}" style="--vc:${vc(e.v)}"><span class="h">${e.a}–${e.b}</span><span><b>${esc(e.t)}</b><br><span class="muted" style="font-size:.8rem">${CAD[e.cad]} · conduz ${esc(PI[e.c]?.curto||e.c)}${ativo(e)?"":" · encerrado em "+fmt(e.ate)}</span></span></button>`).join("") : `<p class="muted">Nada neste dia com esse filtro.</p>`;
}

    return `<div class="card"><div class="eyebrow">${L.length===40?"primeiros 40 resultados":L.length+" resultado"+(L.length===1?"":"s")}</div><div class="lgrid" style="margin-top:8px">${L.map(r=>`<div class="lp"><span class="tx"><b>${esc(r[4]||"Vaga")}</b><span>${esc(r[3])} · ${esc(LOJAS[r[0]][0])} · ${r[1]?"noturno":"diurno"}</span></span>${lchip(r[5])}</div>`).join("")||'<p class="muted">Ninguém encontrado.</p>'}</div></div>`;})();
  if(selLoja===null){ $("#ldet").innerHTML=""; return; }
  const l=LOJAS[selLoja], L=LJ.filter(r=>r[0]===selLoja);
  const turno=t=>{const T=L.filter(r=>r[1]===t); if(!T.length) return "";
    return `<div class="turno"><h3>${t?"Noturno":"Diurno"} <span class="mono muted" style="font-size:.85rem">${T.filter(r=>!isVaga(r)).length} pessoas</span></h3><div class="setores">${[0,1,2,3].map(sx=>{const S=T.filter(r=>r[2]===sx); return S.length?`<div class="setor"><span class="eyebrow">${SETOR[sx]} · ${S.filter(r=>!isVaga(r)).length}</span>${S.map(lperson).join("")}</div>`:"";}).join("")}</div></div>`;};
  $("#ldet").innerHTML = `<div class="card ldet" id="ldetc"><div class="head"><div><div class="eyebrow">${MARCA(selLoja)} · ${esc(l[1])}</div><h2>${esc(l[0])}</h2><p>Gerente responsável: ${esc(l[2])}${L.some(r=>r[7])?". Inclui quem está na aba Bigg's 09.":"."}</p></div><button class="x" id="lx">Fechar loja</button></div>
   <div class="legend">${Object.keys(LST).filter(k=>L.some(r=>r[5]===k)).map(k=>`${lchip(k)} <span class="mono">${L.filter(r=>r[5]===k).length}</span>`).join(" ")}</div>
   ${turno(0)}${turno(1)}</div>`;
}
function vPend(){
  return `<div class="head"><div><div class="eyebrow">Para fechar a atualização</div><h1>Pendências</h1><p>Pontos em que as planilhas e as versões anteriores não batem. Me responda e eu ajusto o organograma e a agenda juntos.</p></div></div>
  <div class="card">${PEND.map(([t,s],i)=>`<div class="pend"><span class="n">${String(i+1).padStart(2,"0")}</span><div><b>${esc(t)}</b><p class="muted" style="margin-top:2px">${esc(s)}</p></div></div>`).join("")}</div>`;

/* ───────── ficha (drawer) ───────── */
function openDrawer(html){ $("#drawer").innerHTML=`<button class="x" id="dx">Fechar</button>`+html; $("#drawer").hidden=false; $("#scrim").hidden=false; $("#dx").focus(); }
function closeDrawer(){ $("#drawer").hidden=true; $("#scrim").hidden=true; }
function fichaPessoa(id){
  const p=PI[id]; if(!p) return; const ev=eventsOf(id).sort((a,b)=>a.d[0]-b.d[0]||a.a.localeCompare(b.a));
  const time=P.filter(x=>x.rep===id); const h=ev.filter(e=>!e.soft).reduce((a,e)=>a+hrs(e)*e.d.length,0);
  openDrawer(`<div style="display:flex;gap:14px;align-items:center"><span class="av" style="--vb:${vb(p.v)};width:54px;height:54px;font-size:1.05rem;border-radius:16px">${ini2(p.nome)}</span><div><h2>${esc(p.curto)}</h2><span class="muted" style="font-size:.85rem">${esc(p.nome)}</span></div></div>
   <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${chip(p)} ${logoCW(p.v)}</div>
   <dl class="kv"><dt>Cargo</dt><dd>${esc(p.cargo)}</dd><dt>Área</dt><dd>${esc(p.g)}</dd>
    <dt>Reporta a</dt><dd>${p.rep?`<button class="link" data-p="${p.rep}">${esc(PI[p.rep].curto)}</button>`:"—"}</dd>
    <dt>Início</dt><dd class="mono">${fmt(p.ini)}</dd><dt>Tempo de casa</dt><dd>${tempoCasa(p.ini)}</dd>
    ${time.length?`<dt>Equipe direta</dt><dd>${time.map(t=>`<button class="link" data-p="${t.id}">${esc(t.curto)}</button>`).join(", ")}</dd>`:""}
    ${p.obs?`<dt>Observação</dt><dd>${esc(p.obs)}</dd>`:""}</dl>
   <div><div class="eyebrow">Agenda da semana · ${ev.length} itens${h?` · ${h.toLocaleString("pt-BR")}h de reunião`:""}</div>
   <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${ev.length?ev.map(e=>`<button class="evrow" data-e="${e.id}" style="--vc:${vc(e.v)}"><span class="h">${e.d.map(d=>DIAS[d]).join(", ")} · ${e.a}</span><span><b>${esc(e.t)}</b>${e.c===id?" · conduz":""}</span></button>`).join(""):`<p class="muted" style="font-size:.88rem">Ainda sem rituais na agenda.</p>`}</div></div>`);
}
function fichaEvento(id){
  const e=E.find(x=>x.id===id); if(!e) return;
  openDrawer(`<div class="eyebrow" style="color:${vc(e.v)}">${esc(e.area)} · ${CAD[e.cad]}${e.soft?" · rotina da área":""}</div><h2>${esc(e.t)}</h2>
   <dl class="kv"><dt>Quando</dt><dd>${e.d.map(d=>DIAS[d]).join(", ")} · <span class="mono">${e.a}–${e.b}</span></dd><dt>Conduz</dt><dd><button class="link" data-p="${e.c}">${esc(PI[e.c]?.curto||e.c)}</button></dd>
   ${e.ate?`<dt>Vigência</dt><dd>${ativo(e)?"até":"encerrado em"} ${fmt(e.ate)}</dd>`:""}</dl>
   <div><div class="eyebrow">Participantes · ${e.p.length}</div><div class="ppl" style="grid-template-columns:1fr;margin-top:8px">${e.p.map(i=>PI[i]).filter(Boolean).map(p=>`<button class="pp" data-p="${p.id}" style="--vc:${vc(p.v)}"><span class="av" style="--vb:${vb(p.v)}">${ini2(p.nome)}</span><span class="tx"><b>${esc(p.curto)}</b><span>${esc(p.cargo)}</span></span></button>`).join("")}</div></div>`);
}

let oSem=0;
function fillOrgWeek(){
  const w=HIST[oSem], ids=new Set(w.itens.flatMap(x=>x[2]||[]));
  document.querySelectorAll(".pcard[data-p]").forEach(b=>b.classList.toggle("hl",ids.has(b.dataset.p)));
  $("#owk").innerHTML=`<div class="eyebrow">Mudanças da semana ${esc(w.sem)}${ids.size?" · destacadas no organograma":""}</div>${w.itens.map(([k,t])=>`<div class="row"><span class="dot" style="margin-top:6px;background:var(${k==="entrou"?"--ok":k==="saiu"?"--crit":"--info"})"></span><p>${esc(t)}</p></div>`).join("")}`;
}

   ``,

   `   • Rafaela Torres → Social, retirada de sócios, MKT & Vendas e Expansão`,

   SEP,

   ``,
   `🔵 *02 · RAGGA GESTÃO* (louro) · 💰 Giovana Ruis`,
   `▸ *Financeiro* — ${c("larissa")} (Gerente Financeira)`,
   `   📤 Contas a pagar: ${lista(["monalisa","aline","mebc","rhayssa"])}`,

   `▸ *Compras:* ${lista(["duda","mvitoria"])}`,
   `▸ *RH/DP:* ${c("vitoria")} (supervisora), ${c("gmodesto")} e ${c("palloma")} (consultora)`,

   pend?`⏳ Vagas pendentes: ${pend}`:"",

   ``,

function syncScroll(){const ts=$("#ts"), os=$("#os"); if(!ts||!os) return;
  const fit=()=>{ts.firstElementChild.style.width=os.scrollWidth+"px"; ts.hidden=os.scrollWidth<=os.clientWidth+2;}; fit(); addEventListener("resize",fit);
  let lock=false; ts.onscroll=()=>{if(lock){lock=false;return;} lock=true; os.scrollLeft=ts.scrollLeft;}; os.onscroll=()=>{if(lock){lock=false;return;} lock=true; ts.scrollLeft=os.scrollLeft;};}
/* ───────── roteamento ───────── */
const R={painel:vPainel,organograma:vOrg,pessoas:vPessoas,agenda:vAgenda,vagas:vVagas,lojas:vLojas,pendencias:vPend};
function go(){
  let k=(location.hash||"#painel").slice(1); if(!R[k]) k="painel";
  renderNav(k); $("#app").innerHTML=`<section class="view">${R[k]()}</section>`;
  if(k==="organograma"){ syncScroll(); fillOrgWeek(); }
  if(k==="pessoas") fillPessoas(); if(k==="agenda") fillAgenda(); if(k==="lojas"){ fillLojas(); if(selLoja!==null) setTimeout(()=>$("#ldetc")?.scrollIntoView({block:"start"}),30); else window.scrollTo(0,0);} else window.scrollTo(0,0);
}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-p],[data-e],[data-s],[data-d],[data-l],#as,#ae,#dx,#lx,#opdf,#ocp,[data-conselho]");
  if(!t) return;
  if(t.id==="dx") return closeDrawer();
  if(t.id==="opdf"){ try{ window.print(); }catch(e){} $("#omsg").textContent="Se a janela de impressão não abrir aqui, use o site no Vercel: lá o botão gera o PDF."; return; }
  if(t.id==="ocp"){ const txt=resumoTxt(), ta=$("#otxt"); ta.value=txt;
    const done=ok=>{$("#omsg").textContent=ok?"Resumo copiado. É só colar no WhatsApp.":"Não consegui copiar sozinho: o texto está aberto abaixo, selecione e copie."; ta.hidden=ok; if(!ok){ta.focus();ta.select();}};
    try{ navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false)); }catch(e){ done(false); } return; }
  if(t.id==="lx"){selLoja=null; document.querySelectorAll(".store").forEach(b=>b.classList.remove("on")); return fillLojas();}
  if(t.dataset.l!==undefined){selLoja=+t.dataset.l; if(location.hash!=="#lojas"){location.hash="lojas"; return;} document.querySelectorAll(".store").forEach(b=>b.classList.toggle("on",+b.dataset.l===selLoja)); fillLojas(); $("#ldetc")?.scrollIntoView({behavior:"smooth",block:"start"}); return;}
  if(t.dataset.p) return fichaPessoa(t.dataset.p);
  if(t.dataset.e) return fichaEvento(t.dataset.e);
  if(t.dataset.conselho) return openDrawer(`<div class="eyebrow">Ao lado da Presidência</div><h2>Conselho consultivo</h2><p>Órgão que orienta, sem poder de mando. Fica fora da linha de comando.</p><div class="ppl" style="grid-template-columns:1fr">${["av","luiz","ag"].map(i=>PI[i]).map(p=>`<button class="pp" data-p="${p.id}" style="--vc:${vc(p.v)}"><span class="av" style="--vb:${vb(p.v)}">${ini2(p.nome)}</span><span class="tx"><b>${esc(p.curto)}</b><span>${esc(p.cargo)}</span></span></button>`).join("")}</div>`);
  if(t.dataset.s){fS=t.dataset.s; document.querySelectorAll("#fs button").forEach(b=>b.classList.toggle("on",b===t)); return fillPessoas();}
  if(t.dataset.d){aDia=+t.dataset.d; document.querySelectorAll("#adias button").forEach(b=>b.classList.toggle("on",b===t)); return fillAgenda();}
  if(t.id==="as"){aSoft=!aSoft; t.classList.toggle("on",aSoft); return fillAgenda();}
  if(t.id==="ae"){aEnc=!aEnc; t.classList.toggle("on",aEnc); return fillAgenda();}
});
document.addEventListener("input",ev=>{ if(ev.target.id==="q"){fQ=ev.target.value; fillPessoas();} if(ev.target.id==="lq"){lQ=ev.target.value; fillLojas();} });
document.addEventListener("change",ev=>{ if(ev.target.id==="osem"){oSem=+ev.target.value; fillOrgWeek();} if(ev.target.id==="fv"){fV=ev.target.value; fillPessoas();} if(ev.target.id==="ap"){aPessoa=ev.target.value; fillAgenda();} });
$("#scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
window.addEventListener("hashchange",()=>{closeDrawer();go();});
go();
</script>
